name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests eval scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - name: фильтр инъекций (без модели)
        run: mkdir -p eval/reports && PYTHONPATH=.:eval uv run python eval/scripts/eval_attacks.py --offline
