[project]
name = "snabzhenets"
version = "0.1.0"
description = "«Снабженец»: ИИ-агент снабженца для бюджетных учреждений"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "arq>=0.26",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "certifi>=2024.0",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Эмбеддинги bge-m3 (torch, тяжело): нужны для подбора КТРУ; без них работает HashingEmbedder
embeddings = ["sentence-transformers>=3"]
# Снимки страниц магазинов (доказательный пакет); браузер ставится `playwright install chromium`
browser = [
    "playwright>=1.47",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl>=3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml_eval"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/ai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "eval"]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI: Depends(...) в значениях по умолчанию — штатный способ
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
